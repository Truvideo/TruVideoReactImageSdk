buildscript {
    apply(from: {
        def searchDir = rootDir.toPath()
        do {
            def p = searchDir.resolve("node_modules/react-native-test-app/android/dependencies.gradle")
            if (p.toFile().exists()) {
                return p.toRealPath().toString()
            }
        } while (searchDir = searchDir.getParent())
        throw new GradleException("Could not find `react-native-test-app`");
    }())
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        // Override AGP version to 8.6.0+ to support compileSdk 35
        // Add AGP first so it takes precedence
        classpath("com.android.tools.build:gradle:8.6.1")
        // Let React Native use its default Kotlin version (1.9.24) for compatibility
        // We'll use -Xskip-metadata-version-check flag to handle 2.2.0 metadata
        getReactNativeDependencies().each { dependency ->
            def depString = dependency.toString()
            // Skip AGP from React Native dependencies since we're using a newer version
            if (!depString.contains("com.android.tools.build:gradle") && 
                !depString.contains("android-gradle-plugin")) {
                classpath(dependency)
            }
        }
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url({
                def searchDir = rootDir.toPath()
                do {
                    def p = searchDir.resolve("node_modules/react-native/android")
                    if (p.toFile().exists()) {
                        return p.toRealPath().toString()
                    }
                } while (searchDir = searchDir.getParent())
                throw new GradleException("Could not find `react-native`");
            }())
        }
        mavenCentral()
        google()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                // Set compileSdk first before accessing it
                if (!project.android.hasProperty("compileSdkVersion") || 
                    project.android.compileSdkVersion == null) {
                    compileSdkVersion 35
                } else {
                    def currentCompileSdk = project.android.compileSdkVersion?.toString()?.replace("android-", "")?.toInteger() ?: 0
                    if (currentCompileSdk < 35) {
                        compileSdkVersion 35
                    }
                }
                
                if (project.android.hasProperty("defaultConfig")) {
                    def currentMinSdk = project.android.defaultConfig.minSdkVersion?.apiLevel ?: 0
                    def currentTargetSdk = project.android.defaultConfig.targetSdkVersion?.apiLevel ?: 0

                    defaultConfig {
                        if (currentMinSdk < 24) {
                            minSdkVersion 24
                        }
                        if (currentTargetSdk < 34) {
                            targetSdkVersion 34
                        }
                    }
                }
            }
        }
        
        // Add Kotlin compiler flag to skip metadata version check for all Kotlin projects
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    freeCompilerArgs += ["-Xskip-metadata-version-check"]
                }
            }
        }
    }
}
